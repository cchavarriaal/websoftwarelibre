<div class="crud-container">
  <div class="page-header">
    <h1 class="page-title">Departamentos de la Empresa</h1>
    <button class="btn-primary">
      <span class="icon">+</span> Nuevo Departamento
    </button>
  </div>

  <div class="crud-layout">
    <!-- Sección 1: Tabla de Registros -->
    <div class="table-card glass-panel">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Nombre y Rol</th>
            <th>Código Organizacional</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Fila estática 1 -->
          <tr>
            <td>
              <div class="user-info">
                <div class="avatar" style="--bg: #10b981;">🏢</div>
                <div class="details">
                  <span class="username">Recursos Humanos</span>
                  <span class="sub-text">Depto Operativo</span>
                </div>
              </div>
            </td>
            <td><span class="badge badge-depto">ID: 3</span></td>
            <td>
              <div class="action-buttons">
                <button class="icon-btn edit-btn" title="Editar Departamento">✏️</button>
                <button class="icon-btn delete-btn" title="Eliminar Departamento">🗑️</button>
              </div>
            </td>
          </tr>
          <!-- Fila estática 2 -->
          <tr>
            <td>
              <div class="user-info">
                <div class="avatar" style="--bg: #3b82f6;">💻</div>
                <div class="details">
                  <span class="username">Tecnología e Información (TI)</span>
                  <span class="sub-text">Soporte Estratégico</span>
                </div>
              </div>
            </td>
            <td><span class="badge badge-depto">ID: 2</span></td>
            <td>
              <div class="action-buttons">
                <button class="icon-btn edit-btn" title="Editar Departamento">✏️</button>
                <button class="icon-btn delete-btn" title="Eliminar Departamento">🗑️</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Sección 2: Panel Lateral de Formulario -->
    <div class="form-card glass-panel" style="align-self: start;">
      <div class="form-header">
        <h2>Detalles del Departamento</h2>
        <button class="close-btn">✕</button>
      </div>
      
      <form class="modern-form">
        <!-- Recordando la obligatoriedad detectada en base de datos -->
        <div class="form-group">
          <label>Nombre del Departamento <span style="color:#ef4444">*</span></label>
          <input type="text" placeholder="Ej. Operaciones, Logística..." value="Recursos Humanos" class="form-control" required maxlength="100" name="nombre">
        </div>

        <div class="form-actions fixed-actions" style="margin-top: 2.5rem;">
          <button type="button" class="btn-secondary">Cancelar</button>
          <button type="button" class="btn-primary">Guardar Departamento</button>
        </div>
      </form>
    </div>
  </div>
</div>
