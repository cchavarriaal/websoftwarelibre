<div class="crud-container">
  <div class="page-header">
    <h1 class="page-title">Configuración de Horarios</h1>
    <button class="btn-primary">
      <span class="icon">+</span> Nueva Jornada
    </button>
  </div>

  <div class="crud-layout">
    <!-- Tabla -->
    <div class="table-card glass-panel" style="overflow-x: auto;">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Nombre y Código</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Días Aplicados</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div class="user-info">
                <div class="avatar" style="--bg: #10b981;">☀️</div>
                <div class="details">
                  <span class="username">Diurno Ordinario</span>
                  <span class="sub-text">Cod. Horario: 1</span>
                </div>
              </div>
            </td>
            <td>08:00 AM</td>
            <td>05:00 PM</td>
            <td><span class="badge badge-default">L-V</span></td>
            <td>
              <div class="action-buttons">
                <button class="icon-btn edit-btn" title="Editar">✏️</button>
                <button class="icon-btn delete-btn" title="Eliminar">🗑️</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <div class="user-info">
                <div class="avatar" style="--bg: #3b82f6;">🌙</div>
                <div class="details">
                  <span class="username">Nocturno Fijo</span>
                  <span class="sub-text">Cod. Horario: 2</span>
                </div>
              </div>
            </td>
            <td>10:00 PM</td>
            <td>06:00 AM</td>
            <td><span class="badge badge-default">L-V</span></td>
            <td>
              <div class="action-buttons">
                <button class="icon-btn edit-btn" title="Editar">✏️</button>
                <button class="icon-btn delete-btn" title="Eliminar">🗑️</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Formulario -->
    <div class="form-card glass-panel" style="align-self: start;">
      <div class="form-header">
        <h2>Detalles de la Jornada</h2>
        <button class="close-btn">✕</button>
      </div>
      
      <form class="modern-form">
        <div class="form-group">
          <label>Nombre de la Jornada <span style="color:#ef4444">*</span></label>
          <input type="text" value="Diurno Ordinario" class="form-control" required maxlength="100" name="nombre" placeholder="Ej: Medio Tiempo">
        </div>

        <div class="form-group twocol">
          <div class="col">
            <label>Hora Ingreso <span style="color:#ef4444">*</span></label>
            <input type="time" value="08:00" class="form-control date-input" required name="hora_entrada">
          </div>
          <div class="col">
            <label>Hora Salida <span style="color:#ef4444">*</span></label>
            <input type="time" value="17:00" class="form-control date-input" required name="hora_salida">
          </div>
        </div>

        <div class="form-group">
          <label>Días Laborables <span style="color:var(--text-muted); font-size:0.75rem;">(Opcional)</span></label>
          <input type="text" value="L-V" class="form-control" placeholder="Ej: Lunes a Viernes" maxlength="50" name="dias_laborables">
        </div>

        <div class="form-actions fixed-actions" style="margin-top: 2.5rem;">
          <button type="button" class="btn-secondary">Cancelar</button>
          <button type="button" class="btn-primary">Guardar Horario</button>
        </div>
      </form>
    </div>
  </div>
</div>
