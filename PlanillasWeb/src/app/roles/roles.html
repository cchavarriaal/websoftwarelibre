<div class="roles-container">
  <div class="page-header">
    <h1 class="page-title">Gestión de <span>Roles</span></h1>
    <button class="btn-primary" (click)="abrirForm()">
      <span class="icon">➕</span> Nuevo Rol
    </button>
  </div>

  @if (showForm()) {
    <div class="form-card glass-panel">
      <h3>{{ editing() ? 'Editar Rol' : 'Crear Nuevo Rol' }}</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre del Rol</label>
          <input type="text" class="form-control" [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" placeholder="Ej: Recursos Humanos">
        </div>
        <div class="form-group full-width">
          <label>Descripción</label>
          <textarea class="form-control" [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)" placeholder="Descripción de permisos..."></textarea>
        </div>
      </div>
      <div class="actions-footer">
        <button class="btn-secondary" (click)="showForm.set(false)">Cancelar</button>
        <button class="btn-primary" (click)="guardar()">Guardar Cambios</button>
      </div>
    </div>
  }

  <div class="table-card glass-panel">
    <table class="data-table">
      <thead>
        <tr>
          <th width="50">ID</th>
          <th width="200">Nombre</th>
          <th>Descripción</th>
          <th width="150" class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (rol of roles(); track rol.id) {
          <tr>
            <td class="text-muted">#{{ rol.id }}</td>
            <td><strong>{{ rol.nombre }}</strong></td>
            <td>{{ rol.descripcion }}</td>
            <td class="actions-cell">
              <button class="btn-icon" (click)="abrirForm(rol)" title="Editar">✏️</button>
              <button class="btn-icon btn-delete" (click)="eliminar(rol.id)" title="Eliminar">🗑️</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center">No hay roles registrados</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
