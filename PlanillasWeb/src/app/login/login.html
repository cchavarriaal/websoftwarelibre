<div class="login-wrapper">
  <div class="login-container glass-panel">
    <div class="login-header">
      <img src="assets/images/planilla_pro_logo.png" alt="Planilla Pro" class="logo">
      <h2>Bienvenido a <span>Planilla Pro</span></h2>
      <p>Gestión de Nómina y Recursos Humanos</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-with-icon">
          <span class="icon">👤</span>
          <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Ingrese su usuario" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-with-icon">
          <span class="icon">🔒</span>
          <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" class="form-control">
        </div>
      </div>

      <button type="submit" class="btn-primary login-btn" [disabled]="loading()">
        {{ loading() ? 'Iniciando Sesión...' : 'Iniciar Sesión' }}
      </button>

      <div class="login-footer">
        <a href="#">¿Olvidó su contraseña?</a>
      </div>
    </form>
  </div>
</div>
