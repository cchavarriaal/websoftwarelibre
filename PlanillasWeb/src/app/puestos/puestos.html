<div class="crud-container">
  <div class="page-header">
    <h1 class="page-title">Gestión de Puestos</h1>
    <button class="btn-primary">
      <span class="icon">+</span> Nuevo Puesto
    </button>
  </div>

  <div class="crud-layout">
    <!-- Sección 1: Tabla de Registros -->
    <div class="table-card glass-panel">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Puesto / ID</th>
            <th>Salario Base Sugerido</th>
            <th>Departamento</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Fila estática 1 -->
          <tr>
            <td>
              <div class="user-info">
                <div class="avatar" style="--bg: #3b82f6;">💼</div>
                <div class="details">
                  <span class="username">Analista Junior</span>
                  <span class="sub-text">Cód: 16</span>
                </div>
              </div>
            </td>
            <td><span class="badge badge-money">₡ 1,250,000.00</span></td>
            <td><span class="badge badge-depto">Recursos Humanos (ID: 1)</span></td>
            <td>
              <div class="action-buttons">
                <button class="icon-btn edit-btn" title="Editar Puesto">✏️</button>
                <button class="icon-btn delete-btn" title="Eliminar Puesto">🗑️</button>
              </div>
            </td>
          </tr>
          <!-- Fila estática 2 -->
          <tr>
            <td>
              <div class="user-info">
                <div class="avatar" style="--bg: #8b5cf6;">🚀</div>
                <div class="details">
                  <span class="username">Desarrollador Senior</span>
                  <span class="sub-text">Cód: 25</span>
                </div>
              </div>
            </td>
            <td><span class="badge badge-money">₡ 2,500,000.00</span></td>
            <td><span class="badge badge-depto">Tecnología e Info (ID: 2)</span></td>
            <td>
              <div class="action-buttons">
                <button class="icon-btn edit-btn" title="Editar Puesto">✏️</button>
                <button class="icon-btn delete-btn" title="Eliminar Puesto">🗑️</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Sección 2: Panel Lateral de Formulario -->
    <div class="form-card glass-panel">
      <div class="form-header">
        <h2>Detalles del Puesto</h2>
        <button class="close-btn">✕</button>
      </div>
      
      <form class="modern-form">
        <div class="form-group">
          <label>Nombre del Puesto <span style="color:#ef4444">*</span></label>
          <input type="text" placeholder="Ej. Arquitecto de Software" value="Analista Junior" class="form-control" required maxlength="100" name="nombre">
        </div>

        <div class="form-group">
          <label>Salario Base Sugerido (Colones) <span style="color:var(--text-muted); font-weight:normal; font-size:0.75rem;">(Opcional)</span></label>
          <div class="input-with-icon">
            <span class="currency-symbol">₡</span>
            <input type="number" value="1250000" class="form-control with-icon" placeholder="0.00" name="salario_base_sugerido">
          </div>
        </div>

        <div class="form-group">
          <label>Departamento Principal <span style="color:var(--text-muted); font-weight:normal; font-size:0.75rem;">(Opcional)</span></label>
          <select class="form-control" name="departamento_id">
            <option value="">-- Sin Asignar --</option>
            <option value="1" selected>Recursos Humanos (ID: 1)</option>
            <option value="2">Tecnología e Info (ID: 2)</option>
            <option value="3">Finanzas y Contabilidad (ID: 3)</option>
          </select>
        </div>

        <div class="form-actions fixed-actions">
          <button type="button" class="btn-secondary">Cancelar</button>
          <button type="button" class="btn-primary">Guardar Puesto</button>
        </div>
      </form>
    </div>
  </div>
</div>
